name: Scrape Live NBA Slate & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Runs automatically every 30 minutes to refresh injuries, odds, and PrizePicks lines
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python Multi-Source NBA Scraper (canopy_nba_engine.py)
        run: |
          python3 canopy_nba_engine.py --output live_slate.json || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact (index.html + live_slate.json)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
